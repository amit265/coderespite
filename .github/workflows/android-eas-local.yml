name: Android Production Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------
      # 4. Generate clean native projects
      # --------------------------------------------------
      - name: Expo prebuild
        run: npx expo prebuild --clean --non-interactive

      # --------------------------------------------------
      # 5. Build using EAS locally on GitHub runner
      # --------------------------------------------------
      - name: Build Android with EAS
        run: |
          npx eas-cli build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output ./coderespite-android.aab

      # --------------------------------------------------
      # 6. Upload AAB to GitHub
      # --------------------------------------------------
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: coderespite-android-production
          path: coderespite-android.aab
          if-no-files-found: error