name: Android Production Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Restore Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MYAPP_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/upload-keystore.jks"

          echo "Keystore restored:"
          ls -lh "$GITHUB_WORKSPACE/android/upload-keystore.jks"

      - name: Configure Android signing
        env:
          STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.gradle"

          cat > "$HOME/.gradle/gradle.properties" <<EOF
          MYAPP_UPLOAD_STORE_FILE=$GITHUB_WORKSPACE/android/upload-keystore.jks
          MYAPP_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD
          MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS
          MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD
          EOF

          echo "Gradle signing configuration created."
          grep '^MYAPP_UPLOAD_STORE_FILE=' "$HOME/.gradle/gradle.properties"

      - name: Verify signing configuration
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew signingReport \
            -PMYAPP_UPLOAD_STORE_FILE="$GITHUB_WORKSPACE/android/upload-keystore.jks" \
            -PMYAPP_UPLOAD_STORE_PASSWORD="$STORE_PASSWORD" \
            -PMYAPP_UPLOAD_KEY_ALIAS="$KEY_ALIAS" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Build Android App Bundle
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew app:bundleRelease \
            -PMYAPP_UPLOAD_STORE_FILE="$GITHUB_WORKSPACE/android/upload-keystore.jks" \
            -PMYAPP_UPLOAD_STORE_PASSWORD="$STORE_PASSWORD" \
            -PMYAPP_UPLOAD_KEY_ALIAS="$KEY_ALIAS" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: coderespite-android-release
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
