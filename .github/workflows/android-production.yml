name: Android Production Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      MYAPP_UPLOAD_STORE_FILE: ${{ github.workspace }}/android/upload-keystore.jks
      MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
      MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
      MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Restore Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MYAPP_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$MYAPP_UPLOAD_STORE_FILE"

          echo "Keystore restored:"
          ls -lh "$MYAPP_UPLOAD_STORE_FILE"

      - name: Verify signing configuration
        run: |
          echo "Checking Android signing configuration..."

          echo "Keystore path:"
          echo "$MYAPP_UPLOAD_STORE_FILE"

          echo "Checking keystore file..."
          test -f "$MYAPP_UPLOAD_STORE_FILE"

          echo "Checking store password..."
          test -n "$MYAPP_UPLOAD_STORE_PASSWORD"

          echo "Checking key alias..."
          test -n "$MYAPP_UPLOAD_KEY_ALIAS"

          echo "Checking key password..."
          test -n "$MYAPP_UPLOAD_KEY_PASSWORD"

          echo "All signing variables are present."
          echo "Keystore file exists."

      - name: Verify Gradle signing
        working-directory: android
        run: ./gradlew signingReport

      - name: Build Android App Bundle
        working-directory: android
        run: ./gradlew app:bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: coderespite-android-release
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error