name: Android Production Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      MYAPP_UPLOAD_STORE_FILE: ${{ github.workspace }}/android/upload-keystore.jks
      MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
      MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
      MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
      SENTRY_DISABLE_AUTO_UPLOAD: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Restore Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MYAPP_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$MYAPP_UPLOAD_STORE_FILE"

          echo "Keystore restored:"
          ls -lh "$MYAPP_UPLOAD_STORE_FILE"

      - name: Verify signing configuration
        run: |
          echo "Checking Android signing configuration..."

          echo "Keystore path:"
          echo "$MYAPP_UPLOAD_STORE_FILE"

          echo "Checking keystore file..."
          test -f "$MYAPP_UPLOAD_STORE_FILE"

          echo "Checking store password..."
          if [ -z "$MYAPP_UPLOAD_STORE_PASSWORD" ]; then
            echo "ERROR: Store password is missing"
            exit 1
          fi

          echo "Checking key alias..."
          if [ -z "$MYAPP_UPLOAD_KEY_ALIAS" ]; then
            echo "ERROR: Key alias is missing"
            exit 1
          fi

          echo "Checking key password..."
          if [ -z "$MYAPP_UPLOAD_KEY_PASSWORD" ]; then
            echo "ERROR: Key password is missing"
            exit 1
          fi

          echo "All signing variables are present."
          echo "Keystore file exists."

      - name: Inspect Android keystore
        run: |
          echo "Inspecting keystore..."

          keytool -list \
            -keystore "$MYAPP_UPLOAD_STORE_FILE" \
            -storepass "$MYAPP_UPLOAD_STORE_PASSWORD"

      - name: Verify release signing key
        run: |
          echo "Verifying release signing key..."

          keytool -list \
            -v \
            -keystore "$MYAPP_UPLOAD_STORE_FILE" \
            -storepass "$MYAPP_UPLOAD_STORE_PASSWORD" \
            -alias "$MYAPP_UPLOAD_KEY_ALIAS" \
            > /tmp/key-info.txt

          echo "Release signing key successfully opened."
          echo "Alias exists."
          echo "Keystore validation passed."

      - name: Verify key password
        run: |
          echo "Verifying private key password..."

          keytool -importkeystore \
            -srckeystore "$MYAPP_UPLOAD_STORE_FILE" \
            -srcstoretype JKS \
            -srcstorepass "$MYAPP_UPLOAD_STORE_PASSWORD" \
            -srcalias "$MYAPP_UPLOAD_KEY_ALIAS" \
            -srckeypass "$MYAPP_UPLOAD_KEY_PASSWORD" \
            -destkeystore /tmp/key-password-test.p12 \
            -deststoretype PKCS12 \
            -deststorepass "temporary-test-password" \
            -destkeypass "temporary-test-password" \
            -noprompt

          echo "Private key password is valid."