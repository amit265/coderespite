name: Android Production Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      MYAPP_UPLOAD_STORE_FILE: ${{ github.workspace }}/android/upload-keystore.jks
      MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
      MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
      MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}

      # Disable Sentry source-map upload for now.
      # We will configure this separately after the AAB build works.
      SENTRY_DISABLE_AUTO_UPLOAD: "true"

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Node
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ---------------------------------------------------------
      # 3. Java
      # ---------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # ---------------------------------------------------------
      # 4. Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------
      # 5. Restore production Android keystore
      # ---------------------------------------------------------
      - name: Restore Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MYAPP_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "Restoring Android production keystore..."

          mkdir -p "$(dirname "$MYAPP_UPLOAD_STORE_FILE")"

          echo "$KEYSTORE_BASE64" | base64 --decode > "$MYAPP_UPLOAD_STORE_FILE"

          echo "Keystore restored:"
          ls -lh "$MYAPP_UPLOAD_STORE_FILE"

      # ---------------------------------------------------------
      # 6. Validate signing credentials BEFORE Gradle build
      # ---------------------------------------------------------
      - name: Validate Android signing credentials
        run: |
          set -e

          echo "=========================================="
          echo "Android Signing Validation"
          echo "=========================================="

          echo ""
          echo "Keystore:"
          ls -lh "$MYAPP_UPLOAD_STORE_FILE"

          echo ""
          echo "Checking required environment variables..."

          test -n "$MYAPP_UPLOAD_STORE_FILE"
          test -n "$MYAPP_UPLOAD_STORE_PASSWORD"
          test -n "$MYAPP_UPLOAD_KEY_ALIAS"
          test -n "$MYAPP_UPLOAD_KEY_PASSWORD"

          echo "Required variables are present."

          echo ""
          echo "Inspecting keystore..."

          keytool -list \
            -keystore "$MYAPP_UPLOAD_STORE_FILE" \
            -storepass "$MYAPP_UPLOAD_STORE_PASSWORD"

          echo ""
          echo "Checking expected alias..."

          keytool -list \
            -keystore "$MYAPP_UPLOAD_STORE_FILE" \
            -storepass "$MYAPP_UPLOAD_STORE_PASSWORD" \
            -alias "$MYAPP_UPLOAD_KEY_ALIAS"

          echo ""
          echo "=========================================="
          echo "Android signing credentials are VALID"
          echo "=========================================="

      # ---------------------------------------------------------
      # 7. Build Android App Bundle
      # ---------------------------------------------------------
      - name: Build Android App Bundle
        working-directory: android
        run: |
          ./gradlew app:bundleRelease --no-daemon

      # ---------------------------------------------------------
      # 8. Verify generated AAB
      # ---------------------------------------------------------
      - name: Verify Android App Bundle
        run: |
          set -e

          echo "Generated AAB files:"

          find android/app/build/outputs/bundle/release \
            -type f \
            -name "*.aab" \
            -exec ls -lh {} \;

          test -n "$(find android/app/build/outputs/bundle/release -type f -name '*.aab')"

          echo ""
          echo "Android App Bundle generated successfully."

      # ---------------------------------------------------------
      # 9. Upload AAB to GitHub Actions artifact
      # ---------------------------------------------------------
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: coderespite-android-production
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14