name: Android Production Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Restore Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MYAPP_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/upload-keystore.jks"

          echo "Keystore restored:"
          ls -lh "$GITHUB_WORKSPACE/android/upload-keystore.jks"

      - name: Verify signing environment
        env:
          MYAPP_UPLOAD_STORE_FILE: ${{ github.workspace }}/android/upload-keystore.jks
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "Keystore path:"
          echo "$MYAPP_UPLOAD_STORE_FILE"

          echo "Keystore exists:"
          test -f "$MYAPP_UPLOAD_STORE_FILE"

          echo "Store password:"
          if [ -n "$MYAPP_UPLOAD_STORE_PASSWORD" ]; then
            echo "SET"
          else
            echo "MISSING"
            exit 1
          fi

          echo "Key alias:"
          if [ -n "$MYAPP_UPLOAD_KEY_ALIAS" ]; then
            echo "SET"
          else
            echo "MISSING"
            exit 1
          fi

          echo "Key password:"
          if [ -n "$MYAPP_UPLOAD_KEY_PASSWORD" ]; then
            echo "SET"
          else
            echo "MISSING"
            exit 1
          fi

      - name: Verify Gradle signing
        working-directory: android
        env:
          MYAPP_UPLOAD_STORE_FILE: ${{ github.workspace }}/android/upload-keystore.jks
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew signingReport

      - name: Build Android App Bundle
        working-directory: android
        env:
          MYAPP_UPLOAD_STORE_FILE: ${{ github.workspace }}/android/upload-keystore.jks
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew app:bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: coderespite-android-release
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error