name: iOS Production Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------
      # 4. Restore iOS signing credentials
      # --------------------------------------------------
      - name: Restore iOS signing credentials
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          mkdir -p credentials/ios

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > credentials/ios/dist-cert.p12

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > credentials/ios/profile.mobileprovision

          echo "iOS signing credentials restored."

          ls -lh credentials/ios/dist-cert.p12
          ls -lh credentials/ios/profile.mobileprovision

      # --------------------------------------------------
      # 5. Create iOS credentials.json
      # --------------------------------------------------
      - name: Configure local iOS credentials
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const credentials = JSON.parse(
            fs.readFileSync('credentials.json', 'utf8')
          );

          credentials.ios = {
            provisioningProfilePath: "credentials/ios/profile.mobileprovision",
            distributionCertificate: {
              path: "credentials/ios/dist-cert.p12",
              password: process.env.IOS_CERTIFICATE_PASSWORD
            }
          };

          fs.writeFileSync(
            'credentials.json',
            JSON.stringify(credentials, null, 2)
          );
          NODE

          echo "Local iOS credentials configured."

      # --------------------------------------------------
      # 6. Build iOS locally on GitHub's macOS runner
      # --------------------------------------------------
      - name: Build iOS IPA
        run: |
          npx eas-cli build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive \
            --output ./coderespite-ios.ipa

      # --------------------------------------------------
      # 7. Upload IPA as GitHub artifact
      # --------------------------------------------------
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: coderespite-ios-release
          path: coderespite-ios.ipa
          if-no-files-found: error