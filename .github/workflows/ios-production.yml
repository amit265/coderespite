name: iOS Production Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------
      # 4. Build iOS locally on GitHub's macOS runner
      # --------------------------------------------------
      - name: Build iOS IPA
        run: |
          npx eas-cli build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive \
            --auto-submit \
            --output ./coderespite-ios.ipa

      # --------------------------------------------------
      # 5. Upload IPA as GitHub artifact
      # --------------------------------------------------
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: coderespite-ios-release
          path: coderespite-ios.ipa
          if-no-files-found: error